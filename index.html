
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600&display=swap');
  :root {
    --bg: #0d0e0f; --surface: #141618; --border: #2a2d30;
    --gold: #c8a84b; --red: #c0392b; --green-win: #2ecc71; --dim: #5a6070; --notsodim: #8a90a0;
    --text: #dce0e8; --muted: #7a8090;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, .wrap { background: black; color: var(--text); font-family: 'Barlow Condensed', sans-serif; }
  .wrap { padding: 12px; }
  .header { text-align: center; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .header-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 4px; color: var(--gold); }
  .header-sub { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--notsodim); letter-spacing: 2px; margin-top: 2px; }
  .view-toggle { display: flex; gap: 6px; margin-bottom: 16px; }
  .view-btn { font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 1px; padding: 5px 12px; background: transparent; border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: all 0.15s; border-radius: 2px; }
  .view-btn.active { background: var(--border); color: var(--text); border-color: #444; }
  .view-btn:hover:not(.active) { border-color: #444; color: var(--text); }
  .comparison-grid { display: none; }
  .comparison-grid.visible { display: block; }
  .cg-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .cg-table th { font-family: 'Share Tech Mono', monospace; font-size: 14px; letter-spacing: 1px; color: var(--notsodim); padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); text-transform: uppercase; }
  .cg-table th.right { text-align: right; }
  .cg-table td { padding: 7px 8px; border-bottom: 1px solid #1c1f22; font-variant-numeric: tabular-nums; font-size: 13px; }
  .cg-table tr:hover td { background: #161a1e; }
  .metric-name { font-family: 'Barlow Condensed', sans-serif; color: var(--muted); font-size: 12px; letter-spacing: 0.5px; min-width: 160px; }
  .val-cell { text-align: right; font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--text); min-width: 80px; }
  .val-cell.winner { color: var(--green-win); font-weight: bold; position: relative; }
  .val-cell.winner::after { content: '▲'; font-size: 8px; margin-left: 3px; vertical-align: middle; opacity: 0.8; }
  .category-header td { font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 2px; color: var(--gold); padding: 12px 8px 4px; background: transparent !important; border-bottom: 1px solid var(--border); }
  .dossier-view { display: none; }
  .dossier-view.visible { display: block; }
  .dossier-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .dossier-card { background: var(--surface); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; transition: border-color 0.2s; }
  .dossier-card:hover { border-color: #444; }
  .card-header { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .soldier-num { font-family: 'Bebas Neue', sans-serif; font-size: 34px; color: var(--gold); line-height: 1; min-width: 36px; }
  .soldier-meta { flex: 1; }
  .soldier-name { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1.5px; color: var(--text); }
  .soldier-role { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--dim); letter-spacing: 1px; margin-top: 2px; }
  .medal-row { display: flex; gap: 4px; flex-wrap: wrap; padding: 6px 12px; border-bottom: 1px solid var(--border); min-height: 30px; }
  .medal { font-family: 'Share Tech Mono', monospace; font-size: 11px; padding: 2px 6px; border-radius: 1px; letter-spacing: 0.5px; }
  .medal.combat { background: #3a1a1a; color: #e05050; border: 1px solid #5a2a2a; }
  .medal.support { background: #182438; color: #50a0e0; border: 1px solid #2a4a6a; }
  .medal.logi { background: #2a2a10; color: #c0c050; border: 1px solid #5a5a1a; }
  .medal.medic { background: #083008; color: #50c070; border: 1px solid #2a5a3a; }
  .medal.chaos { background: #2a1a3a; color: #c070e0; border: 1px solid #4a2a5a; }
  .stat-rows { padding: 8px 0; }
  .stat-row { display: flex; align-items: center; padding: 3px 12px; gap: 8px; }
  .stat-label { flex: 1; font-size: 13px; color: var(--muted); letter-spacing: 0.3px; }
  .stat-val { font-family: 'Share Tech Mono', monospace; font-size: 13px; color: var(--text); }
  .stat-val.best { color: var(--green-win); }
  .stat-bar-wrap { width: 50px; height: 3px; background: #222; border-radius: 1px; overflow: hidden; }
  .stat-bar { height: 100%; background: var(--border); border-radius: 1px; }
  .stat-bar.best { background: var(--green-win); }
  .radar-view { display: none; }
  .radar-view.visible { display: block; }
  .radar-wrap { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; justify-content: center; }
  canvas#radar { max-width: 500px; width: 100%; }
  .radar-legend { display: flex; flex-direction: column; gap: 8px; min-width: 140px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .score-board { margin-top: 16px; border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
  .score-header { font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 2px; color: var(--gold); padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .score-row { display: flex; align-items: center; padding: 7px 12px; gap: 10px; border-bottom: 1px solid #1c1f22; font-size: 13px; }
  .score-rank { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--dim); min-width: 22px; }
  .score-rank.first { color: var(--gold); }
  .score-rank.second { color: #aaa; }
  .score-rank.third { color: #cd7f32; }
  .score-name { flex: 1; font-size: 13px; letter-spacing: 0.5px; }
  .score-pts { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--green-win); }
  .score-bar-outer { width: 80px; height: 4px; background: #222; border-radius: 2px; overflow: hidden; }
  .score-bar-inner { height: 100%; border-radius: 2px; }
</style>

<div class="wrap">
  <div class="header">
    <div class="header-title">Regiment Activity Report</div>
    <div class="header-sub">FOXHOLE // CLASSIFIED // WARBOARD ANALYTICS</div>
  </div>

  <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
    <div class="view-toggle">
      <button class="view-btn active" onclick="setView('compare')">COMPARISON</button>
      <button class="view-btn" onclick="setView('dossier')">DOSSIERS</button>
      <button class="view-btn" onclick="setView('radar')">RADAR</button>
    </div>
  </div>

  <div class="comparison-grid visible" id="compareView"></div>
  <div class="dossier-view" id="dossierView"></div>
  <div class="radar-view" id="radarView">
    <div class="radar-wrap">
      <canvas id="radar" height="300"></canvas>
      <div>
        <div class="radar-legend" id="radarLegend"></div>
      </div>
    </div>
    <div class="score-board">
      <div class="score-header">Overall Score Ranking</div>
      <div id="scoreRows"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const soldiers = [
  {
    name: "Thetechnopig",
    role: "SIEGE BREAKER",
    medals: [{label: 'DEMOLISHER', cls: 'combat'}, {label: 'QUARTERMASTER', cls: 'logi'}, {label: 'FRONT-LINE BUILDER', cls: 'support'}],
    enemyPlayerDmg: 129816, friendlyPlayerDmg: 9874,
    enemyStructDmg: 769543, friendlyStructDmg: 45117,
    construction: 125030, repairing: 21880,
    healing: 1942, revivals: 20,
    vehiclesCaptured: 7,
    selfDmgNeutral: 0, selfDmgColonial: 0, selfDmgWarden: 873,
    materialsSubmitted: 400645, materialsGathered: 24352,
    supplyDelivered: 478829
  },
  {
    name: "Providence",
    role: "ELITE COMBAT MEDIC",
    medals: [{label: 'LIFE SAVER', cls: 'medic'}, {label: 'RESCUE OPS', cls: 'medic'}, {label: 'SUPPLY CHAIN', cls: 'logi'}],
    enemyPlayerDmg: 22074, friendlyPlayerDmg: 9090,
    enemyStructDmg: 246781, friendlyStructDmg: 18087,
    construction: 7053, repairing: 12940,
    healing: 59959, revivals: 302,
    vehiclesCaptured: 13,
    selfDmgNeutral: 684, selfDmgColonial: 0, selfDmgWarden: 1159,
    materialsSubmitted: 5000, materialsGathered: 6032,
    supplyDelivered: 221104
  },
  {
    name: "Kathira",
    role: "LOGISTICS ARCHITECT",
    medals: [{label: 'SUPPLY TITAN', cls: 'logi'}, {label: 'RESOURCES MOGUL', cls: 'logi'}, {label: 'FRONT-LINE BUILDER', cls: 'support'}],
    enemyPlayerDmg: 23308, friendlyPlayerDmg: 2142,
    enemyStructDmg: 71361, friendlyStructDmg: 4244,
    construction: 25438, repairing: 3762,
    healing: 8265, revivals: 54,
    vehiclesCaptured: 1,
    selfDmgNeutral: 1125, selfDmgColonial: 434, selfDmgWarden: 138,
    materialsSubmitted: 996934, materialsGathered: 587699,
    supplyDelivered: 2050136
  }
];

// This array now expands automatically as you add more soldiers
const radarColors = ['#c8a84b', '#e05050', '#50c0e0', '#a070e0', '#2ecc71', '#f1c40f', '#e67e22', '#3498db', '#9b59b6', '#1abc9c'];

// --- AUTO-CALCULATION LOGIC ---

function getAutoRadarData() {
  // Find the maximums in the group to scale everyone from 0-100
  const max = {
    dmg: Math.max(...soldiers.map(s => s.enemyPlayerDmg)),
    struct: Math.max(...soldiers.map(s => s.enemyStructDmg)),
    heal: Math.max(...soldiers.map(s => s.healing)),
    const: Math.max(...soldiers.map(s => s.construction)),
    logi: Math.max(...soldiers.map(s => s.supplyDelivered)),
    disc: Math.max(...soldiers.map(s => s.friendlyPlayerDmg + s.friendlyStructDmg))
  };

  return soldiers.map(s => {
    // We calculate a score for 6 dimensions (0 to 100)
    const combat = (s.enemyPlayerDmg / (max.dmg || 1)) * 100;
    const structures = (s.enemyStructDmg / (max.struct || 1)) * 100;
    const healing = (s.healing / (max.heal || 1)) * 100;
    const construction = (s.construction / (max.const || 1)) * 100;
    const logistics = (s.supplyDelivered / (max.logi || 1)) * 100;
    
    // For discipline, lower team damage is better
    const teamDmg = s.friendlyPlayerDmg + s.friendlyStructDmg;
    const discipline = Math.max(0, 100 - ((teamDmg / (max.disc || 1)) * 100));

    // Calculate an overall "Power Score" for the Ranking board
    const overallScore = Math.round((combat + structures + healing + construction + logistics + discipline) / 6);

    return {
      name: s.name,
      score: overallScore,
      data: [combat, structures, healing, construction, logistics, discipline]
    };
  });
}

// --- UPDATED BUILD FUNCTIONS ---

let radarChart = null;
function buildRadar() {
  const calculatedData = getAutoRadarData();
  const el = document.getElementById('radarLegend');
  let legendHtml = '';
  
  soldiers.forEach((s, i) => {
    legendHtml += `<div class="legend-item"><div class="legend-dot" style="background:${radarColors[i % radarColors.length]}"></div><span>${s.name}</span></div>`;
  });
  el.innerHTML = legendHtml;

  const dimLabels = ['Combat', 'Structures', 'Healing', 'Construction', 'Logistics', 'Discipline'];

  const datasets = calculatedData.map((r, i) => ({
    label: r.name,
    data: r.data,
    borderColor: radarColors[i % radarColors.length],
    backgroundColor: radarColors[i % radarColors.length] + '22',
    pointBackgroundColor: radarColors[i % radarColors.length],
    borderWidth: 1.5,
    pointRadius: 3,
  }));

  if (radarChart) radarChart.destroy();
  radarChart = new Chart(document.getElementById('radar'), {
    type: 'radar',
    data: { labels: dimLabels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        r: {
          min: 0, max: 100,
          ticks: { display: false },
          grid: { color: '#2a2d30' },
          angleLines: { color: '#2a2d30' },
          pointLabels: { color: '#7a8090', font: { size: 11 } },
        }
      }
    }
  });

  // Automatically sort the ranking board by the calculated score
  const sorted = [...calculatedData].sort((a, b) => b.score - a.score);
  const maxScore = Math.max(...sorted.map(s => s.score));
  const rankLabels = ['1ST','2ND','3RD','4TH','5TH','6TH','7TH','8TH'];
  const rankClasses = ['first','second','third','','','','',''];
  
  let scoreHtml = '';
  sorted.forEach((s, rank) => {
    const color = radarColors[soldiers.findIndex(orig => orig.name === s.name) % radarColors.length];
    const pct = Math.round((s.score / (maxScore || 1)) * 100);
    scoreHtml += `<div class="score-row">
      <div class="score-rank ${rankClasses[rank] || ''}">${rankLabels[rank] || (rank + 1) + 'TH'}</div>
      <div class="score-name" style="color:${color}">${s.name}</div>
      <div class="score-bar-outer"><div class="score-bar-inner" style="width:${pct}%; background:${color}"></div></div>
      <div class="score-pts">${s.score} pts</div>
    </div>`;
  });
  document.getElementById('scoreRows').innerHTML = scoreHtml;
}

function setView(v) {
  document.getElementById('compareView').classList.toggle('visible', v === 'compare');
  document.getElementById('dossierView').classList.toggle('visible', v === 'dossier');
  document.getElementById('radarView').classList.toggle('visible', v === 'radar');
  document.querySelectorAll('.view-btn').forEach((b, i) => {
    const views = ['compare','dossier','radar'];
    b.classList.toggle('active', views[i] === v);
  });
  if (v === 'radar') buildRadar();
}

// Initial build
buildCompare();
buildDossiers();
</script>
